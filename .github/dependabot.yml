version: 2
# Low-noise configuration for a single maintainer.
# - Routine version updates run monthly and are grouped into a single PR per
#   ecosystem, so at most one PR per ecosystem appears each month.
# - Security updates need Dependabot alerts and security updates switched on
#   in the repository's settings; both have been on since 2026-10-02
#   (Brennen's decision at round R1's Gate C). GitHub's target-branch
#   reference: they always target the default branch (main), and with
#   target-branch set the options below do not apply to them.
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "BrennenJohnston"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"
    reviewers:
      - "BrennenJohnston"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
